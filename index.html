<!DOCTYPE html>
<html lang="ru">
<head>

<script src="config.js"></script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<meta name="theme-color" content="#FFFFFF">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">

<style>
:root{color-scheme:light;--hero:#0F172A;--bg:#FFFFFF;--card:#fff;--tx:#0F172A;--mut:#5B6577;--ac:#2563EB;--acx:#fff;--bd:#E7E8EC;--soft:#F2F3F5;--softx:#1F2937;--amb:#FEF3C7;--ok:#15803D;--warn:#B45309;--bad:#B91C1C;--ic:#8A94A6;--hlbg:#FFF3E4;--hlbd:#F2C48D;--hltx:#7C4A12;--hlic:#D97706;--badbg:#FDECEA;--badbd:#F3B4AD;--sh:0 0 0 1px #ECEDF0,0 6px 18px rgba(15,23,42,.05);--sh2:0 10px 24px rgba(37,99,235,.32);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="dark"]{color-scheme:dark;--hero:#1B3566;--bg:#0B1730;--card:#13254A;--tx:#E8EEFA;--mut:#9FB0CF;--ac:#4F8CFF;--acx:#0B1730;--bd:#223A66;--soft:#1C335F;--softx:#DCE7FF;--amb:#3A2E12;--ok:#5CC08A;--warn:#E8A93A;--bad:#F0877B;--ic:#8FA3C7;--hlbg:#3A2A14;--hlbd:#8A5A1E;--hltx:#F5C98A;--hlic:#F0A83A;--badbg:#3A1C1C;--badbd:#8A3A36;--sh:0 0 0 1px #223A66;--sh2:0 8px 20px rgba(79,140,255,.25)}
.tgl{flex:0 0 auto;width:38px;height:38px;padding:0;border-radius:50%;background:var(--soft);color:var(--softx);font-size:18px;line-height:1;display:flex;align-items:center;justify-content:center}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 Manrope,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:20px;font-weight:800;margin:0}
.ic{display:inline-flex;width:22px;height:22px;flex:0 0 auto}.ic svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.top{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:28px;padding:14px;margin-bottom:12px;box-shadow:var(--sh)}
.tmid{flex:1;min-width:0}
.tmid select{width:100%;border:0;background:transparent;font-weight:800;font-size:20px;padding:0;text-overflow:ellipsis;line-height:1.2}
.tmid .mut{font-size:13px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top button.g{flex:0 0 44px;width:44px;height:44px;padding:0;border-radius:50%;background:var(--soft);color:var(--softx);display:flex;align-items:center;justify-content:center}
.top button.g:last-child{background:var(--ac);color:var(--acx);box-shadow:var(--sh2);width:48px;height:48px;flex-basis:48px}
select,input,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px;width:100%}
textarea{min-height:76px;resize:vertical}
button{font:inherit;border:0;border-radius:16px;padding:12px 16px;background:var(--ac);color:var(--acx);font-weight:700;cursor:pointer}
button.g{background:var(--soft);color:var(--softx);border:0;font-weight:600;padding:8px 14px;font-size:14px;border-radius:14px}
.tabs{display:flex;gap:2px;background:var(--card);border-radius:999px;padding:6px;margin-bottom:14px;box-shadow:var(--sh);overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1 0 auto;background:none;color:var(--tx);border:0;border-radius:999px;padding:11px 14px;font-size:15px;font-weight:500;white-space:nowrap}
.tabs button.on{background:var(--ac);color:var(--acx);font-weight:700}
.card{background:var(--card);border:0;border-radius:24px;padding:16px;margin-bottom:12px;box-shadow:var(--sh)}
.ttl{display:flex;gap:10px;align-items:center;font-weight:600;font-size:17px;min-width:0}.ttl .ic{color:var(--tx)}
.row{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.mut{color:var(--mut);font-size:14px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--soft);color:var(--tx);border:0;border-radius:999px;padding:6px 13px;margin:8px 8px 0 0;font-size:13px;font-weight:500}.chip .ic{width:16px;height:16px;color:var(--tx)}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.stat>div{background:var(--card);border-radius:22px;padding:14px 12px;text-align:left;box-shadow:var(--sh);min-width:0}
.stat b{display:block;font-size:20px;font-weight:800;line-height:1.2;white-space:nowrap}
.stat .mut{font-size:13px;color:var(--tx);font-weight:500}
.si{display:flex;width:20px;height:20px;margin:0 0 6px auto;color:var(--ic)}
.hl{background:var(--hlbg)!important;box-shadow:inset 0 0 0 1.5px var(--hlbd),var(--sh)!important}.hl b{color:var(--hltx)}.hl .si{color:var(--hlic)}
.hl.bad{background:var(--badbg)!important;box-shadow:inset 0 0 0 1.5px var(--badbd),var(--sh)!important}.hl.bad b{color:var(--bad)}.hl.bad .si{color:var(--bad)}
.al{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:24px;padding:14px 16px;margin-bottom:12px;box-shadow:var(--sh);cursor:pointer}
.alt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px}.alt b{font-weight:800}
.al .ic:last-child{color:var(--mut);width:20px;height:20px}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}
.acts{display:flex;gap:8px;margin-top:12px}
.add{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:17px;font-size:16px;font-weight:700;box-shadow:var(--sh2);margin-bottom:14px}
#m{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:flex-end;justify-content:center;z-index:5}
#m.on{display:flex}
#mb{background:var(--bg);width:100%;max-width:720px;max-height:92%;overflow:auto;border-radius:28px 28px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px))}
label{display:block;font-size:13px;font-weight:600;color:var(--mut);margin:12px 0 5px}
label.c{display:flex;gap:8px;align-items:center;color:var(--tx);font-size:16px;font-weight:500}
label.c input{width:auto}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
.thumb{width:64px;height:64px;object-fit:cover;border-radius:14px;margin:0 6px 6px 0;vertical-align:middle;cursor:pointer}
.av{flex:0 0 60px;width:60px;height:60px;border-radius:50%;overflow:hidden;background:var(--soft);padding:5px;display:flex;align-items:center;justify-content:center;font-size:26px;cursor:pointer}
.av img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.fb{display:flex;gap:8px;margin-bottom:12px}.fb select{flex:1;padding:10px 12px;min-width:0;border-radius:999px}.fb button{white-space:nowrap;border-radius:999px}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.gi{padding:10px;margin:0}.gi video,.gi img{display:block;width:100%;max-height:60vh;object-fit:contain;border-radius:16px;background:#000}
.done{text-decoration:line-through;color:var(--mut)}
.hd{display:flex;align-items:center;gap:8px;margin:0 2px 12px}.hd h1{font-size:18px}
body{padding-bottom:calc(86px + env(safe-area-inset-bottom,0px))}
.vsw{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-bottom:12px;padding:2px}.vsw::-webkit-scrollbar{display:none}
.vsw button{flex:0 0 auto;background:var(--card);color:var(--tx);box-shadow:var(--sh);border-radius:999px;padding:9px 14px;font-weight:600;font-size:14px;display:flex;gap:6px;align-items:center}
.vsw button.on{background:var(--tx);color:var(--card)}
.vsw .ic{width:18px;height:18px}
.hero{background:var(--hero);color:#fff;border-radius:28px;padding:18px;margin-bottom:12px}
.hero .hr{display:flex;gap:12px;align-items:flex-start}
.hero .lb{font-size:12px;color:#CBD5E1;letter-spacing:.06em;text-transform:uppercase}
.hero .nm{font-size:24px;font-weight:800;line-height:1.15;word-break:break-word}
.hero .av{flex:0 0 52px;width:52px;height:52px;background:rgba(255,255,255,.14);padding:4px}
.plate{display:inline-block;background:#fff;color:#0F172A;border-radius:6px;padding:2px 8px;font-size:13px;font-weight:800;letter-spacing:.04em;white-space:nowrap;margin-top:6px}
.hbtn{flex:0 0 40px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;padding:0;display:flex;align-items:center;justify-content:center;margin-left:auto}
.odob{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.14);color:#fff;border-radius:999px;padding:8px 14px;font-size:14px;font-weight:700;margin-top:14px}.odob .ic{width:18px;height:18px}
.hst button{background:none;padding:0;color:inherit;text-align:left;font-weight:inherit;border-radius:0}
.hst{display:flex;gap:14px 18px;margin-top:16px;flex-wrap:wrap}.hst b{display:block;font-size:20px;font-weight:800}.hst span{font-size:12px;color:#CBD5E1}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.tile{background:var(--card);color:var(--tx);box-shadow:var(--sh);border-radius:22px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:10px;font-weight:400;min-width:0}
.tile .ti{width:40px;height:40px;border-radius:12px;background:var(--soft);color:var(--tx);display:flex;align-items:center;justify-content:center}
.tile b{display:block;font-size:15px;font-weight:700}.tile small{display:block;font-size:12px;color:var(--mut);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile.hl{background:var(--hlbg);box-shadow:inset 0 0 0 1.5px var(--hlbd),var(--sh)}.tile.hl small{color:var(--hltx)}.tile.hl .ti{background:var(--card);color:var(--hlic)}
.tile.bad{background:var(--badbg);box-shadow:inset 0 0 0 1.5px var(--badbd),var(--sh)}.tile.bad small{color:var(--bad)}.tile.bad .ti{background:var(--card);color:var(--bad)}
.bnav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);display:flex;justify-content:center;padding:4px 6px calc(8px + env(safe-area-inset-bottom,0px));z-index:4}
.bnav>div{display:flex;width:100%;max-width:720px}
.bnav button{flex:1;background:none;color:var(--mut);border-radius:12px;padding:8px 0 4px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600}
.bnav button.on{color:var(--ac);font-weight:800}
.bnav .ic{width:24px;height:24px}
.back{display:flex;align-items:center;gap:8px;margin-bottom:14px;min-width:0}
.back button{flex:0 0 auto;background:var(--soft);color:var(--tx);border-radius:999px;padding:8px 14px 8px 8px;display:flex;gap:4px;align-items:center;font-weight:600;font-size:14px;max-width:55%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.back h2{margin:0;font-size:20px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow{width:100%;display:flex;align-items:center;gap:12px;background:var(--card);color:var(--tx);box-shadow:var(--sh);border-radius:20px;padding:14px 16px;margin-bottom:10px;font-weight:600;text-align:left}
.prow .ic:last-child{margin-left:auto;color:var(--mut);width:18px;height:18px}
.bars div{display:flex;align-items:center;gap:8px;font-size:13px;margin:6px 0}.bars i{display:block;height:10px;border-radius:5px;background:var(--ac);min-width:2px}.bars span:first-child{width:34px;color:var(--mut)}.bars em{font-style:normal;margin-left:auto;font-weight:700;white-space:nowrap}
.sres{width:100%;display:flex;align-items:center;gap:12px;background:var(--card);color:var(--tx);box-shadow:var(--sh);border-radius:18px;padding:12px 14px;margin-bottom:8px;text-align:left;font-weight:400}
.sres .ti{width:38px;height:38px;border-radius:12px;background:var(--soft);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.sres b{display:block;font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sres small{display:block;font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sres>span:nth-child(2){min-width:0;flex:1}
mark{background:#FDE68A;color:#1F1300;border-radius:3px;padding:0 1px}
.help h3{margin:0 0 6px;font-size:16px;font-weight:800;display:flex;gap:8px;align-items:center}.help p{margin:4px 0;font-size:14px;color:var(--tx)}
</style>
</head>
<body>
<div class="wrap">
  <div class="hd"><h1>Гараж</h1><span class="mut" id="sync" style="flex:1"></span><button class="tgl" id="searchBtn" aria-label="Поиск"></button><button class="tgl" id="themeBtn" aria-label="Сменить тему"></button></div>
  <div id="app"></div>
  <nav class="bnav" id="bnav" aria-label="Разделы"><div></div></nav>
  <div class="mut" style="text-align:center;margin:24px 0 8px;font-size:13px">
    
    <div style="margin-top:8px">by laker.</div>
  </div>
</div>
<div id="m"><div id="mb"></div></div>
<script>
var ME={owner:false},ADM={},items=[],col=null,assets=null,S={grp:null,sec:null,lastGrp:'moto',y:'',m:'',asc:false,open:{}};
var $=function(s){return document.querySelector(s)};
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function fdate(s){if(!s)return'';var p=s.split('-');return p[2]+'.'+p[1]+'.'+p[0]}
function money(n){return n?Number(n).toLocaleString('ru-RU')+' ₽':'0 ₽'}
function strip(o){var c=Object.assign({},o);delete c.id;return c}
function by(t){return items.filter(function(i){return i.t===t})}

/* ---------- storage (Supabase) ---------- */
var SUPA_URL=(window.CFG||{}).url||'',SUPA_KEY=(window.CFG||{}).key||'';   // значения лежат в config.js
SUPA_URL=SUPA_URL.replace(/\/(functions|rest|auth|storage)\/.*$/,'').replace(/\/+$/,'');
var R2U={used:0,quota:0},TOK='',USAGE={used:0,quota:0,premium:false},sb=null,UID=null,ALL=[],BASE=SUPA_URL+'/storage/v1/object/public/media/';
function msg(t){var a=$('#app');a.textContent='';a.appendChild(el('div','empty',t))}
function mark(r){
  if(r&&r.error){var m=r.error.message||'';$('#sync').textContent='ошибка сохранения';
    alert(m.indexOf('Лимит')===0?m:'Не удалось сохранить: '+m);reloadItems();return}
  $('#sync').textContent='☁️ сохранено';
}
function reloadItems(){
  if(!sb)return;
  sb.from('items').select('id,owner,data').eq('owner',UID).then(function(q){
    if(q.error)return;var list=q.data.map(function(x){return Object.assign({id:x.id},x.data)});
    sb.from('documents').select('id,owner,data').eq('owner',UID).then(function(d){
      if(!d.error)list=list.concat(d.data.map(function(x){return Object.assign({id:x.id},x.data)}));
      items=list;render()},function(){items=list;render()});
  });
}
function put(id,data){
  data=strip(data);data.updated=Date.now();
  var o=Object.assign({id:id},data),i=items.findIndex(function(x){return x.id===id});
  if(i>=0)items[i]=o;else items.push(o);render();
  sb.from(data.t==='doc'?'documents':'items').upsert({id:id,owner:UID,data:data}).then(mark);
}
function del(id){
  var gone=items.find(function(x){return x.id===id});
  if(gone&&gone.photos&&assets)gone.photos.forEach(function(f){(gone.t==='doc'?sb.storage.from('docs').remove([f]):rmf(f)).catch(function(){})});
  items=items.filter(function(x){return x.id!==id});render();
  sb.from(gone&&gone.t==='doc'?'documents':'items').delete().eq('id',id).then(mark);
}
function mb(n){return (n/1048576).toFixed(n<10485760?1:0)}
function VIDMAX(){return (USAGE.premium?50:20)*1024*1024}
function errMsg(e,d){var m=(e&&e.message)||'';return m.indexOf('Не хватает')===0?m:m.indexOf('row-level security')>=0?'Не хватает места в вашей квоте. Удалите лишнее или оформите подписку.':d}
function getUsage(){return sb.rpc('my_usage').then(function(r){if(!r.error&&r.data)USAGE=r.data})}
async function upl(blob){
  if(USAGE.quota&&USAGE.used+blob.size>USAGE.quota)throw new Error('Не хватает места: свободно '+mb(Math.max(0,USAGE.quota-USAGE.used))+' МБ из '+mb(USAGE.quota));
  var ext=(blob.type.split('/')[1]||'bin').replace('jpeg','jpg').replace('quicktime','mov');
  var path=UID+'/'+uid()+'.'+ext;
  var r=await sb.storage.from('media').upload(path,blob,{contentType:blob.type});
  if(r.error)throw r.error;USAGE.used+=blob.size;return {id:path};
}
function rmf(path){return sb.storage.from('media').remove([path]).then(function(r){getUsage().then(render);return r})}
async function init(){
  var stage='старт',tg=window.Telegram&&Telegram.WebApp;
  if(!tg||!tg.initData){msg('Откройте приложение через Telegram: найдите своего бота и нажмите кнопку меню.');return}
  tg.ready();tg.expand();
  try{var dk=document.documentElement.getAttribute('data-theme')==='dark';tg.setHeaderColor(dk?'#0B1730':'#FFFFFF');tg.setBackgroundColor(dk?'#0B1730':'#FFFFFF')}catch(e){}
  if(!SUPA_URL||!SUPA_KEY||SUPA_KEY.indexOf('ВСТАВЬТЕ')===0){msg('Не заполнен файл config.js (адрес проекта и ключ).');return}
  msg('Загрузка…');
  var wd=setTimeout(function(){msg('Долго нет ответа ['+stage+']. Закройте и откройте приложение заново.')},15000);
  try{
    stage='вход через функцию tg-auth';
    var r=await fetch(SUPA_URL+'/functions/v1/tg-auth',{method:'POST',headers:{'Content-Type':'application/json','apikey':SUPA_KEY},body:JSON.stringify({initData:tg.initData})});
    var j=await r.json();if(!r.ok||!j.access_token)throw new Error(j.error||'ошибка входа');
    stage='подключение к данным';
    var tok=j.access_token;TOK=tok;UID=JSON.parse(atob(tok.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))).sub;
    sb=supabase.createClient(SUPA_URL,SUPA_KEY,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false},global:{headers:{Authorization:'Bearer '+tok}}});
    ME.uid=UID;ME.owner=!!j.admin;col=true;assets={upload:upl,delete:rmf};
    stage='загрузка данных (таблица items)';var q=await sb.from('items').select('id,owner,data');if(q.error)throw q.error;
    ALL=q.data;items=q.data.filter(function(x){return x.owner===UID}).map(function(x){return Object.assign({id:x.id},x.data)});
    try{var dq=await sb.from('documents').select('id,owner,data').eq('owner',UID);if(!dq.error)items=items.concat(dq.data.map(function(x){return Object.assign({id:x.id},x.data)}))}catch(e){}
    $('#sync').textContent='☁️ сохранено';
    try{await getUsage()}catch(e){}
    r2usage();
    if(ME.owner)startAdmin();
    clearTimeout(wd);render();
  }catch(e){clearTimeout(wd);msg('Не удалось войти ['+stage+']: '+(e.message||e)+' · адрес: '+SUPA_URL)}
}

/* ---------- forms ---------- */
function openForm(title,fields,init,save){
  var b=$('#mb');b.textContent='';b.appendChild(el('h1','',title));
  var ins={};
  fields.forEach(function(f){
    var k=f[0],lab=f[1],type=f[2],inp;
    if(type==='check'){var l=el('label','c');inp=document.createElement('input');inp.type='checkbox';inp.checked=!!(init&&init[k]);l.appendChild(inp);l.appendChild(document.createTextNode(lab));b.appendChild(l)}
    else{
      b.appendChild(el('label','',lab));
      inp=document.createElement(type==='area'?'textarea':type==='sel'?'select':'input');
      if(type==='sel'){f[5].forEach(function(o){var op=el('option','',o);op.value=o;inp.appendChild(op)})}
      else if(type!=='area')inp.type=type;
      if(type==='number')inp.inputMode='decimal';
      inp.value=(init&&init[k]!=null)?init[k]:(f[3]||'');
      if(f[4])inp.placeholder=f[4];
      if(type==='text')inp.maxLength=200;

async function toJpeg(file){
  var bm;try{bm=await createImageBitmap(file)}catch(e){throw new Error('Не удалось прочитать фото. Сохраните его как JPG или PNG и повторите (формат HEIC на компьютере не поддерживается).')}
  var k=Math.min(1,1600/Math.max(bm.width,bm.height)),cv=document.createElement('canvas');
  cv.width=Math.max(1,Math.round(bm.width*k));cv.height=Math.max(1,Math.round(bm.height*k));
  var cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,cv.width,cv.height);cx.drawImage(bm,0,0,cv.width,cv.height);
  return await new Promise(function(res,rej){cv.toBlob(function(b){b?res(b):rej(new Error('Не удалось сжать фото'))},'image/jpeg',0.85)});
}
async function shrink(file){
  try{var bm=await createImageBitmap(file);var k=Math.min(1,1400/Math.max(bm.width,bm.height));var cv=document.createElement('canvas');cv.width=Math.round(bm.width*k);cv.height=Math.round(bm.height*k);cv.getContext('2d').drawImage(bm,0,0,cv.width,cv.height);

}

var FN=SUPA_URL+'/functions/v1/tg-media',TG_VIDEO_MAX=50000000,TG_BIG=20000000;
function quotaErr(j){return 'Не хватает места: свободно '+gb(Math.max(0,j.quota-j.used))+' из '+gb(j.quota)}
async function mcall(action,body){
  var r;try{r=await fetch(FN,{method:'POST',headers:{'Content-Type':'application/json','apikey':SUPA_KEY,'Authorization':'Bearer '+TOK},body:JSON.stringify(Object.assign({action:action},body||{}))})}

function r2usage(){return mcall('usage').then(function(j){R2U=j}).catch(function(){})}
function sendFile(file,kind,onp){return new Promise(function(res,rej){
  var fd=new FormData();fd.append('file',file,file.name||(kind==='video'?'video.mp4':'photo.jpg'));fd.append('kind',kind);
  var x=new XMLHttpRequest();x.open('POST',FN);x.setRequestHeader('Authorization','Bearer '+TOK);x.setRequestHeader('apikey',SUPA_KEY);
  x.upload.onprogress=function(e){if(e.lengthComputable)onp(Math.round(e.loaded/e.total*100))};
  x.onload=function(){var j={};try{j=JSON.parse(x.responseText)}catch(e){}
    if(x.status<300)res(j);else rej(new Error(j.error==='quota'?quotaErr(j):(j.error||'Ошибка загрузки ('+x.status+')')))};
  x.onerror=function(){rej(new Error('Запрос оборвался (файл '+Math.round(file.size/1048576*10)/10+' МБ). Возможно, функция не принимает такой размер. Попробуйте файл поменьше.'))};
  x.send(fd)})}
function drawThumb(src,w,h){
  var k=Math.min(1,480/Math.max(w,h)),cv=document.createElement('canvas');cv.width=Math.round(w*k);cv.height=Math.round(h*k);
  cv.getContext('2d').drawImage(src,0,0,cv.width,cv.height);
  return new Promise(function(res){cv.toBlob(function(b){res(b)},'image/jpeg',0.75)});
}
function thumbOf(file,vid){
  if(!vid)return createImageBitmap(file).then(function(bm){return drawThumb(bm,bm.width,bm.height)}).catch(function(){return null});
  return new Promise(function(res){
    var v=document.createElement('video'),u=URL.createObjectURL(file),done=false;
    function fin(b){if(done)return;done=true;URL.revokeObjectURL(u);res(b)}
    v.muted=true;v.playsInline=true;v.preload='auto';v.src=u;
    v.onloadeddata=function(){try{v.currentTime=Math.min(1,(v.duration||2)/4)}catch(e){fin(null)}};
    v.onseeked=function(){drawThumb(v,v.videoWidth,v.videoHeight).then(fin).catch(function(){fin(null)})};
    v.onerror=function(){fin(null)};setTimeout(function(){fin(null)},10000);
  });
}

        var msg='Загрузка '+(i+1)+' из '+files.length+'…';if(btn)btn.textContent=msg;st.textContent=msg;
        var blob=await toJpeg(files[i]),path=UID+'/'+uid()+'.jpg';
        var r=await sb.storage.from('docs').upload(path,blob,{contentType:'image/jpeg'});if(r.error)throw r.error;
        done.push(path);
      }
    }catch(e){alert(errMsg(e,'Не удалось загрузить скан'))}
    if(btn)btn.textContent='📷 Фото / скан';
    if(done.length){var cur=items.find(function(x){return x.id===it.id})||it;put(it.id,Object.assign({},cur,{photos:(cur.photos||[]).concat(done)}))}
    else st.textContent='☁️ сохранено';
  },true);
}
function showDocPhoto(it,p,url){
  var b=$('#mb');b.textContent='';var im=document.createElement('img');im.src=url;im.style.cssText='width:100%;border-radius:12px';b.appendChild(im);
  var r=el('div','acts'),cl=el('button','','Закрыть'),dl=el('button','g','Удалить скан');
  cl.onclick=function(){$('#m').classList.remove('on');b.textContent=''};
  dl.onclick=function(){if(!confirm('Удалить скан?'))return;$('#m').classList.remove('on');b.textContent='';
    put(it.id,Object.assign({},it,{photos:(it.photos||[]).filter(function(x){return x!==p})}));sb.storage.from('docs').remove([p]).catch(function(){})};
  r.appendChild(cl);r.appendChild(dl);b.appendChild(r);$('#m').classList.add('on');
}
function fillDocImgs(){
  var need=[].slice.call(document.querySelectorAll('img[data-p]')).filter(function(i){return !i.getAttribute('src')});
  if(!need.length||!sb)return;
  sb.storage.from('docs').createSignedUrls(need.map(function(i){return i.dataset.p}),3600).then(function(r){
    if(r.error||!r.data)return;
    r.data.forEach(function(x){if(x.signedUrl)need.forEach(function(i){if(i.dataset.p===x.path)i.src=x.signedUrl})});
  });
}
function renderDocs(app,a){
  var h=el('div','mut','🔒 Документы и сканы видны только вам: другие участники и вкладка владельца их не показывают.');h.style.marginBottom='10px';app.appendChild(h);
  var ab=plusBtn('Добавить документ');ab.onclick=function(){docForm(a)};app.appendChild(ab);
  var l=by('doc').filter(function(d){return d.atv===a.id}).sort(function(x,y){
    var p=daysLeft(x.until),q=daysLeft(y.until);if(p===null&&q===null)return 0;if(p===null)return 1;if(q===null)return -1;return p-q});
  if(!l.length){app.appendChild(el('div','empty',a.id==='me'?'Добавьте права, паспорт и другие личные документы. Можно сразу сфотографировать обе стороны.':'Здесь будут ПТС, страховка, техосмотр и другие документы. Сфотографируйте их, чтобы всегда были под рукой, и следите за сроками.'));return}
  l.forEach(function(d){
    var c=el('div','card'),rw=el('div','row'),st=docState(d);
    rw.appendChild(el('b','',docName(d)));rw.appendChild(el('span',st.cls,st.txt));c.appendChild(rw);
    if(d.num)c.appendChild(el('div','mut','№ '+d.num));
    if(d.notes)c.appendChild(el('div','mut',d.notes));
    var w=el('div');w.style.marginTop='6px';
    (d.photos||[]).forEach(function(p){var im=document.createElement('img');im.className='thumb';im.dataset.p=p;im.onclick=function(){if(im.getAttribute('src'))showDocPhoto(d,p,im.src)};w.appendChild(im)});
    var pb=el('button','g','📷 Фото / скан');pb.onclick=function(){addDocPhoto(d,pb)};w.appendChild(pb);c.appendChild(w);
    var ac=el('div','acts'),e1=el('button','g','Изменить'),d1=el('button','g','Удалить');
    e1.onclick=function(){docForm(a,d)};d1.onclick=function(){if(confirm('Удалить документ и его сканы?'))del(d.id)};
    ac.appendChild(e1);ac.appendChild(d1);c.appendChild(ac);app.appendChild(c);
  });
  fillDocImgs();
}

/* ---------- участники, установка, перенос ---------- */
function startAdmin(){
  Promise.all([sb.from('profiles').select('*'),sb.from('items').select('id,owner,data'),sb.rpc('all_usage'),sb.from('files').select('owner,size')]).then(function(rs){
    if(rs[0].error||rs[1].error)return;
    ALL=rs[1].data;ADM={};var us={},r2={};((rs[3]&&rs[3].data)||[]).forEach(function(x){r2[x.owner]=(r2[x.owner]||0)+Number(x.size)});((rs[2]&&rs[2].data)||[]).forEach(function(x){us[x.user_id]=Number(x.used)});
    rs[0].data.forEach(function(p){ADM[p.id]={name:p.name||'Без имени',user:p.username?'@'+p.username:'',
      prof:{visits:p.visits,lastSeen:p.last_seen?new Date(p.last_seen).getTime():0},
      used:us[p.id]||0,r2:r2[p.id]||0,plan:p.plan_until,rows:ALL.filter(function(x){return x.owner===p.id})}});
    if(S.sec==='adm')render();
  });
}
function fdt(ts){if(!ts)return '—';var d=new Date(ts);return d.toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit'})+' '+d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})}
function bigImg(src){
  var b=$('#mb');b.textContent='';var im=document.createElement('img');im.src=src;im.style.cssText='width:100%;border-radius:12px';b.appendChild(im);
  var cl=el('button','','Закрыть');cl.style.marginTop='10px';cl.onclick=function(){$('#m').classList.remove('on')};b.appendChild(cl);$('#m').classList.add('on');
}
function adminPhotos(d,ids){
  if(!ids||!ids.length)return;var w=el('div');w.style.marginTop='6px';
  ids.forEach(function(id){var im=document.createElement('img');im.src=BASE+id;im.className='thumb';im.onclick=function(){bigImg(im.src)};w.appendChild(im)});d.appendChild(w);
}
function adminItem(k,i,av){
  var d=el('div','card');d.style.cssText='margin:0 0 8px;padding:10px';
  var a=av.find(function(q){return q.id===i.atv}),an=a?a.name:'',rw=el('div','row');
  function meta(arr){var m=arr.filter(Boolean).join(' · ');if(m)d.appendChild(el('div','mut',m))}
  if(k==='rec'){
    rw.appendChild(el('b','',(i.std?'🔧 ':'')+i.title));rw.appendChild(el('span','mut',fdate(i.date)));d.appendChild(rw);
    meta([an,(i.odo!==''&&i.odo!=null)?i.odo+' '+(a?a.unit:''):'',i.cost?money(i.cost):'']);
    if(i.parts)d.appendChild(el('div','mut','Заменил: '+i.parts.replace(/\n/g,', ')));
    if(i.notes)d.appendChild(el('div','mut',i.notes));
    adminPhotos(d,i.photos);
  }else if(k==='part'){
    rw.appendChild(el('b','',i.name));if(i.price)rw.appendChild(el('span','',money(i.price)));d.appendChild(rw);
    meta([an,i.num?'№ '+i.num:'',i.shop]);
    if(i.notes)d.appendChild(el('div','mut',i.notes));
    adminPhotos(d,i.photos);
  }else if(k==='buy'){
    rw.appendChild(el('b','',(i.done?'✓ ':'')+i.name+(i.qty>1?' × '+i.qty:'')));
    if(i.price)rw.appendChild(el('span','mut',money((Number(i.price)||0)*(Number(i.qty)||1))));d.appendChild(rw);
    meta([an,i.notes]);
    adminPhotos(d,i.photos);
  }else{
    rw.appendChild(el('b','',i.title));rw.appendChild(el('span','mut',fdate(i.date)));d.appendChild(rw);
    var m;
    if(i.store==='tg'){m=document.createElement('img');m.alt='▶ Открыть';m.src=i.thumb?BASE+i.thumb:'';m.onclick=function(){playMedia(i)}}
    else if(i.kind==='video'){m=document.createElement('video');m.src=BASE+i.file+'#t=0.1';m.controls=true;m.preload='metadata';m.playsInline=true}
    else{m=document.createElement('img');m.src=BASE+i.file;m.onclick=function(){bigImg(m.src)}}
    m.style.cssText='display:block;width:100%;max-height:50vh;object-fit:contain;border-radius:10px;background:#000;margin-top:6px';
    d.appendChild(m);meta([an,i.notes]);
  }
  return d;
}
function renderAdmin(app){
  var ids=Object.keys(ADM).sort(function(x,y){return ADM[y].prof.lastSeen-ADM[x].prof.lastSeen});
  var cnt=function(t){return ALL.filter(function(x){return x.data.t===t}).length};
  var top=el('div','row');
  top.appendChild(el('span','mut','Участников: '+ids.length+' · техники: '+cnt('atv')+' · записей: '+cnt('rec')));
  var rf=el('button','g','↻ Обновить');rf.onclick=function(){startAdmin()};top.appendChild(rf);
  top.style.marginBottom='10px';app.appendChild(top);
  if(!ids.length){app.appendChild(el('div','empty','Пока никого нет.'));return}

  var h=el('b','','Участники');h.style.cssText='display:block;margin:6px 0';app.appendChild(h);
  ids.forEach(function(u){
    var o=ADM[u],c=el('div','card'),rw=el('div','row');
    var nb=el('b','',o.name+(u===UID?' (вы)':''));rw.appendChild(nb);
    rw.appendChild(el('span','mut',(o.user?o.user+' · ':'')+'заходов: '+(o.prof.visits||0)));c.appendChild(rw);
    c.appendChild(el('div','mut','Последний вход: '+fdt(o.prof.lastSeen)));
    c.appendChild(el('div','mut','Чеки и фото: '+mb(o.used||0)+' МБ · галерея: '+gb(o.r2||0)+' · '+(o.plan&&new Date(o.plan)>new Date()?'подписка до '+new Date(o.plan).toLocaleDateString('ru-RU'):'бесплатный')));
    var rows=o.rows.map(function(x){return x.data}),n=function(t){return rows.filter(function(i){return i.t===t})};
    var av=n('atv');
    av.forEach(function(a){c.appendChild(el('span','chip',icon(a)+' '+a.name+(a.odo?' · '+a.odo+' '+a.unit:'')))});
    var bar=el('div','acts');bar.style.cssText='flex-wrap:wrap;margin-top:8px';
    [['rec','Записи'],['part','Запчасти'],['buy','Купить'],['media','Галерея']].forEach(function(t){
      var b=el('button',S.open[u]===t[0]?'':'g',t[1]+' ('+n(t[0]).length+')');
      b.onclick=function(){S.open[u]=S.open[u]===t[0]?null:t[0];render()};bar.appendChild(b)});
    c.appendChild(bar);
    var op=S.open[u];
    if(op){
      var list=n(op).sort(function(x,y){return (y.date||y.added||'').localeCompare(x.date||x.added||'')||(y.updated||0)-(x.updated||0)});
      var box=el('div');box.style.marginTop='10px';
      if(!list.length)box.appendChild(el('div','mut','Пока пусто.'));
      list.slice(0,40).forEach(function(i){box.appendChild(adminItem(op,i,av))});
      c.appendChild(box);
    }
    app.appendChild(c);
  });

  var h2=el('b','','Последние действия');h2.style.cssText='display:block;margin:14px 0 6px';app.appendChild(h2);
  var lab={atv:'техника',rec:'запись',part:'запчасть',buy:'покупка',media:'галерея',tire:'шины'};
  ALL.filter(function(x){return x.data.updated&&lab[x.data.t]})
    .sort(function(x,y){return y.data.updated-x.data.updated}).slice(0,30).forEach(function(x){
      var d=x.data,who=(ADM[x.owner]||{}).name||'?';
      var c=el('div','card'),rw=el('div','row');
      rw.appendChild(el('span','',who+' · '+lab[d.t]+': '+(d.title||d.name||'')));
      rw.appendChild(el('span','mut',fdt(d.updated)));c.appendChild(rw);app.appendChild(c);
    });
}
function installHelp(){
  var b=$('#mb');b.textContent='';b.appendChild(el('h1','','Как установить'));
  [['iPhone (Safari)','Нажмите «Поделиться» → «На экран “Домой”».'],['Android (Chrome)','Меню ⋮ → «Установить приложение» или «Добавить на главный экран».'],['Компьютер','В Chrome нажмите значок установки в адресной строке или закрепите вкладку.']].forEach(function(t){
    var c=el('div','card');c.appendChild(el('b','',t[0]));c.appendChild(el('div','mut',t[1]));b.appendChild(c)});
  b.appendChild(el('div','mut','Иконка откроет приложение в один тап, как обычное. Для входа нужен аккаунт Claude: так хранятся ваши данные.'));
  var cl=el('button','','Закрыть');cl.style.marginTop='10px';cl.onclick=function(){$('#m').classList.remove('on')};b.appendChild(cl);$('#m').classList.add('on');
}
function migBanner(app){
  if(!(col&&S.mig&&S.mig.length&&!items.length))return;
  var c=el('div','card');c.appendChild(el('b','','Найдены данные из старой версии'));
  var bt=el('button','add','Перенести ('+S.mig.length+')');bt.style.marginTop='8px';bt.style.marginBottom='0';
  bt.onclick=function(){bt.textContent='Переношу…';S.mig.forEach(function(d){col.doc(d.id).set(d.data())});S.mig=null};
  c.appendChild(bt);app.appendChild(c);
}

function applyTheme(t){
  document.documentElement.setAttribute('data-theme',t);
  var c=t==='dark'?'#0B1730':'#FFFFFF',b=document.getElementById('themeBtn');
  if(b){b.textContent=t==='dark'?'☀️':'🌙';b.title=t==='dark'?'Белая тема':'Тёмно-синяя тема'}
  var m=document.querySelector('meta[name=theme-color]');if(m)m.setAttribute('content',c);
  try{var tg=window.Telegram&&Telegram.WebApp;if(tg){tg.setHeaderColor(c);tg.setBackgroundColor(c)}}catch(e){}
}
(function(){
  var t='light';try{t=localStorage.getItem('theme')==='dark'?'dark':'light'}catch(e){}
  applyTheme(t);
  var sbn=document.getElementById('searchBtn');sbn.appendChild(ico('search'));sbn.onclick=function(){S.grp='search';S.sec=null;render();window.scrollTo(0,0)};
  document.getElementById('themeBtn').onclick=function(){
    t=t==='dark'?'light':'dark';try{localStorage.setItem('theme',t)}catch(e){}applyTheme(t);
  };
})();
init();
</script>
